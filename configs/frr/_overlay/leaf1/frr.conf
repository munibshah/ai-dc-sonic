! AIDC Lab — leaf1 (AS 65101) — underlay + EVPN-VXLAN (Lab 2 canonical)
frr defaults datacenter
hostname leaf1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.1.1/32
 ip address 10.0.10.1/32
!
interface eth1
 description to_spine1
 ip address 10.1.1.1/31
!
interface eth2
 description to_spine2
 ip address 10.1.2.1/31
!
interface eth3
 description to_gpu1
 ip address 10.2.1.0/31
!
interface eth4
 description to_gpu2
 ip address 10.2.1.2/31
!
router bgp 65101
 bgp router-id 10.0.1.1
 bgp bestpath as-path multipath-relax
 no bgp default ipv4-unicast
 neighbor SPINES peer-group
 neighbor SPINES advertisement-interval 0
 neighbor SPINES timers 3 9
 neighbor 10.1.1.0 remote-as 65000
 neighbor 10.1.1.0 peer-group SPINES
 neighbor 10.1.1.0 description spine1
 neighbor 10.1.2.0 remote-as 65000
 neighbor 10.1.2.0 peer-group SPINES
 neighbor 10.1.2.0 description spine2
 !
 address-family ipv4 unicast
  network 10.0.1.1/32
  network 10.0.10.1/32
  network 10.2.1.0/31
  network 10.2.1.2/31
  maximum-paths 64
  neighbor SPINES activate
  neighbor SPINES soft-reconfiguration inbound
 exit-address-family
 !
 ! EVPN: advertise all kernel VXLAN devices (br10100 + vxlan10100 created by
 ! /etc/frr/overlay-setup.sh). FRR auto-derives RD = VTEP:VNI and RT from VNI.
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
 exit-address-family
!
line vty
!
