! AIDC Lab — spine1 (AS 65000) — underlay + EVPN-VXLAN transit (Lab 3 canonical)
! Identical to _overlay/spine1/frr.conf — Lab 3 only changes the leaves
! (drops eth3/eth4 L3 IPs since worker ports become bridge members of VLAN 1000).
frr defaults datacenter
hostname spine1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to_leaf1
 ip address 10.1.1.0/31
!
interface eth2
 description to_leaf2
 ip address 10.1.1.2/31
!
interface eth3
 description to_leaf3
 ip address 10.1.1.4/31
!
interface eth4
 description to_leaf4
 ip address 10.1.1.6/31
!
router bgp 65000
 bgp router-id 10.0.0.1
 bgp bestpath as-path multipath-relax
 no bgp default ipv4-unicast
 neighbor LEAVES peer-group
 neighbor LEAVES advertisement-interval 0
 neighbor LEAVES timers 3 9
 neighbor 10.1.1.1 remote-as 65101
 neighbor 10.1.1.1 peer-group LEAVES
 neighbor 10.1.1.1 description leaf1
 neighbor 10.1.1.3 remote-as 65102
 neighbor 10.1.1.3 peer-group LEAVES
 neighbor 10.1.1.3 description leaf2
 neighbor 10.1.1.5 remote-as 65103
 neighbor 10.1.1.5 peer-group LEAVES
 neighbor 10.1.1.5 description leaf3
 neighbor 10.1.1.7 remote-as 65104
 neighbor 10.1.1.7 peer-group LEAVES
 neighbor 10.1.1.7 description leaf4
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  maximum-paths 64
  neighbor LEAVES activate
  neighbor LEAVES soft-reconfiguration inbound
 exit-address-family
 !
 ! EVPN transit: spine relays Type-2/Type-3 routes between leaves. FRR 7.5
 ! preserves L2VPN-EVPN next-hops on eBGP peers by default (verified — see
 ! ADR-002 update). There is no neighbor knob that has a visible effect for
 ! this in this FRR build: `next-hop-unchanged` (FRR 8.x+ shorthand) errors,
 ! and `attribute-unchanged next-hop` is silently accepted but not persisted.
 ! In FRR 8.x+ or modern SONiC builds, add `neighbor LEAVES next-hop-unchanged`
 ! here as defense-in-depth. See lab2-exercise.md Step 4 for the textbook
 ! failure mode this would protect against.
 address-family l2vpn evpn
  neighbor LEAVES activate
 exit-address-family
!
line vty
!
!
! ============ Lab 5: SRv6 uSID dual-stack additions ============
!
! ---- SRv6 dual-stack: IPv6 underlay on the leaf-facing links (Lab 5) ----
interface eth1
 ipv6 address fc00:1:1::/127
!
interface eth2
 ipv6 address fc00:1:2::/127
!
interface eth3
 ipv6 address fc00:1:3::/127
!
interface eth4
 ipv6 address fc00:1:4::/127
!
router bgp 65000
 !
 ! ---- IPv6 underlay BGP: relay the leaves' uSID locator /48s (Lab 5) ----
 neighbor LEAVES6 peer-group
 neighbor LEAVES6 advertisement-interval 0
 neighbor LEAVES6 timers 3 9
 neighbor fc00:1:1::1 remote-as 65101
 neighbor fc00:1:1::1 peer-group LEAVES6
 neighbor fc00:1:1::1 description leaf1-v6
 neighbor fc00:1:2::1 remote-as 65102
 neighbor fc00:1:2::1 peer-group LEAVES6
 neighbor fc00:1:2::1 description leaf2-v6
 neighbor fc00:1:3::1 remote-as 65103
 neighbor fc00:1:3::1 peer-group LEAVES6
 neighbor fc00:1:3::1 description leaf3-v6
 neighbor fc00:1:4::1 remote-as 65104
 neighbor fc00:1:4::1 peer-group LEAVES6
 neighbor fc00:1:4::1 description leaf4-v6
 !
 address-family ipv6 unicast
  maximum-paths 64
  neighbor LEAVES6 activate
  neighbor LEAVES6 soft-reconfiguration inbound
 exit-address-family
!
