! AIDC Lab — leaf1 (AS 65101) — underlay + EVPN-VXLAN with workers ON THE OVERLAY (Lab 3 canonical)
!
! Differences vs _overlay/leaf1/frr.conf:
!   - eth3 and eth4 no longer have L3 IPs. They are bridge members of
!     VLAN 1000 instead (added by overlay-setup.sh after FRR boots).
!   - The matching `network 10.2.1.0/31` / `10.2.1.2/31` BGP IPv4-unicast
!     advertisements are gone, since the worker /31 underlay is retired.
!
! eth1/eth2 (spine uplinks) and the loopback IPs are unchanged.
frr defaults datacenter
hostname leaf1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.1.1/32
 ip address 10.0.10.1/32
!
interface eth1
 description to_spine1
 ip address 10.1.1.1/31
!
interface eth2
 description to_spine2
 ip address 10.1.2.1/31
!
! eth3 and eth4 deliberately have NO ip address — they're L2 access ports
! into the VLAN 1000 bridge (configured by overlay-setup.sh).
!
router bgp 65101
 bgp router-id 10.0.1.1
 bgp bestpath as-path multipath-relax
 no bgp default ipv4-unicast
 neighbor SPINES peer-group
 neighbor SPINES advertisement-interval 0
 neighbor SPINES timers 3 9
 neighbor 10.1.1.0 remote-as 65000
 neighbor 10.1.1.0 peer-group SPINES
 neighbor 10.1.1.0 description spine1
 neighbor 10.1.2.0 remote-as 65000
 neighbor 10.1.2.0 peer-group SPINES
 neighbor 10.1.2.0 description spine2
 !
 address-family ipv4 unicast
  network 10.0.1.1/32
  network 10.0.10.1/32
  maximum-paths 64
  neighbor SPINES activate
  neighbor SPINES soft-reconfiguration inbound
 exit-address-family
 !
 ! EVPN: advertise the kernel VXLAN dev (vtep-1000) + the local bridge fdb.
 ! advertise-all-vni picks up the VLAN 1000 bridge and originates Type-2
 ! routes for the MACs gpu1/gpu2 land on Bridge once they're up on overlay.
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
 exit-address-family
!
line vty
!
!
! ============ Lab 5: SRv6 uSID dual-stack additions ============
!
! ---- SRv6 dual-stack: IPv6 on the spine uplinks (Lab 5) ----
! The per-leaf "service" prefix fd00:100:1::/64 (the hosts behind this leaf)
! is installed as a local route by overlay-setup.sh, not here.
interface eth1
 ipv6 address fc00:1:1::1/127
!
interface eth2
 ipv6 address fc00:2:1::1/127
!
ipv6 route fcbb:bb00:1::/48 blackhole
!
! ---- SRv6 uSID locator (Lab 5 SOLVE) ----
! behavior usid => compressed micro-SIDs. block-len 32 + node-len 16 = a /48
! locator; shown under: show segment-routing srv6 locator
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bb00:1::/48 block-len 32 node-len 16
    behavior usid
   exit
   !
  exit
  !
 exit
 !
exit
!
router bgp 65101
 !
 ! ---- IPv6 underlay BGP: advertise this leaf's uSID locator /48 (Lab 5) ----
 ! maximum-paths 64 installs BOTH spine paths => uSID traffic ECMPs per-flow.
 ! no network import-check: the locator /48 is anchored by a blackhole static
 ! (unreachable next-hop), so without this FRR marks the network-originated
 ! prefix "invalid" and never advertises it. This is the standard knob for
 ! originating an aggregate/anchor prefix.
 no bgp network import-check
 neighbor SPINES6 peer-group
 neighbor SPINES6 remote-as 65000
 neighbor SPINES6 advertisement-interval 0
 neighbor SPINES6 timers 3 9
 neighbor fc00:1:1::0 peer-group SPINES6
 neighbor fc00:1:1::0 description spine1-v6
 neighbor fc00:2:1::0 peer-group SPINES6
 neighbor fc00:2:1::0 description spine2-v6
 !
 address-family ipv6 unicast
  network fcbb:bb00:1::/48
  maximum-paths 64
  neighbor SPINES6 activate
  neighbor SPINES6 soft-reconfiguration inbound
 exit-address-family
!
