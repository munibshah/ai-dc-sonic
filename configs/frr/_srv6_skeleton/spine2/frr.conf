! AIDC Lab — spine2 (AS 65000) — underlay + EVPN-VXLAN transit (Lab 3 canonical)
! Identical to _overlay/spine2/frr.conf — Lab 3 only changes the leaves.
frr defaults datacenter
hostname spine2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to_leaf1
 ip address 10.1.2.0/31
!
interface eth2
 description to_leaf2
 ip address 10.1.2.2/31
!
interface eth3
 description to_leaf3
 ip address 10.1.2.4/31
!
interface eth4
 description to_leaf4
 ip address 10.1.2.6/31
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp bestpath as-path multipath-relax
 no bgp default ipv4-unicast
 neighbor LEAVES peer-group
 neighbor LEAVES advertisement-interval 0
 neighbor LEAVES timers 3 9
 neighbor 10.1.2.1 remote-as 65101
 neighbor 10.1.2.1 peer-group LEAVES
 neighbor 10.1.2.1 description leaf1
 neighbor 10.1.2.3 remote-as 65102
 neighbor 10.1.2.3 peer-group LEAVES
 neighbor 10.1.2.3 description leaf2
 neighbor 10.1.2.5 remote-as 65103
 neighbor 10.1.2.5 peer-group LEAVES
 neighbor 10.1.2.5 description leaf3
 neighbor 10.1.2.7 remote-as 65104
 neighbor 10.1.2.7 peer-group LEAVES
 neighbor 10.1.2.7 description leaf4
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  maximum-paths 64
  neighbor LEAVES activate
  neighbor LEAVES soft-reconfiguration inbound
 exit-address-family
 !
 ! EVPN transit — see spine1 for rationale + the FRR 7.5 default-preserves note.
 address-family l2vpn evpn
  neighbor LEAVES activate
 exit-address-family
!
line vty
!
!
! ============ Lab 5: SRv6 uSID dual-stack additions ============
!
! ---- SRv6 dual-stack: IPv6 underlay on the leaf-facing links (Lab 5) ----
interface eth1
 ipv6 address fc00:2:1::/127
!
interface eth2
 ipv6 address fc00:2:2::/127
!
interface eth3
 ipv6 address fc00:2:3::/127
!
interface eth4
 ipv6 address fc00:2:4::/127
!
router bgp 65000
 !
 ! ---- IPv6 underlay BGP: relay the leaves' uSID locator /48s (Lab 5) ----
 neighbor LEAVES6 peer-group
 neighbor LEAVES6 advertisement-interval 0
 neighbor LEAVES6 timers 3 9
 neighbor fc00:2:1::1 remote-as 65101
 neighbor fc00:2:1::1 peer-group LEAVES6
 neighbor fc00:2:1::1 description leaf1-v6
 neighbor fc00:2:2::1 remote-as 65102
 neighbor fc00:2:2::1 peer-group LEAVES6
 neighbor fc00:2:2::1 description leaf2-v6
 neighbor fc00:2:3::1 remote-as 65103
 neighbor fc00:2:3::1 peer-group LEAVES6
 neighbor fc00:2:3::1 description leaf3-v6
 neighbor fc00:2:4::1 remote-as 65104
 neighbor fc00:2:4::1 peer-group LEAVES6
 neighbor fc00:2:4::1 description leaf4-v6
 !
 address-family ipv6 unicast
  maximum-paths 64
  neighbor LEAVES6 activate
  neighbor LEAVES6 soft-reconfiguration inbound
 exit-address-family
!
