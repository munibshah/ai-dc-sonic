! AIDC Lab — leaf3 (AS 65103) — underlay + EVPN-VXLAN with workers ON THE OVERLAY (Lab 3 canonical)
! See leaf1's frr.conf for the rationale (eth3/eth4 are L2 bridge members, not L3).
frr defaults datacenter
hostname leaf3
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.1.3/32
 ip address 10.0.10.3/32
!
interface eth1
 description to_spine1
 ip address 10.1.1.5/31
!
interface eth2
 description to_spine2
 ip address 10.1.2.5/31
!
!
router bgp 65103
 bgp router-id 10.0.1.3
 bgp bestpath as-path multipath-relax
 no bgp default ipv4-unicast
 neighbor SPINES peer-group
 neighbor SPINES advertisement-interval 0
 neighbor SPINES timers 3 9
 neighbor 10.1.1.4 remote-as 65000
 neighbor 10.1.1.4 peer-group SPINES
 neighbor 10.1.1.4 description spine1
 neighbor 10.1.2.4 remote-as 65000
 neighbor 10.1.2.4 peer-group SPINES
 neighbor 10.1.2.4 description spine2
 !
 address-family ipv4 unicast
  network 10.0.1.3/32
  network 10.0.10.3/32
  maximum-paths 64
  neighbor SPINES activate
  neighbor SPINES soft-reconfiguration inbound
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
 exit-address-family
!
line vty
!
!
! ============ Lab 5: SRv6 uSID dual-stack additions ============
!
! ---- SRv6 dual-stack: IPv6 on the spine uplinks (Lab 5) ----
! The per-leaf "service" prefix fd00:100:3::/64 (the hosts behind this leaf)
! is installed as a local route by overlay-setup.sh, not here.
interface eth1
 ipv6 address fc00:1:3::1/127
!
interface eth2
 ipv6 address fc00:2:3::1/127
!
ipv6 route fcbb:bb00:3::/48 blackhole
!
router bgp 65103
 !
 ! ---- IPv6 underlay BGP: advertise this leaf's uSID locator /48 (Lab 5) ----
 ! maximum-paths 64 installs BOTH spine paths => uSID traffic ECMPs per-flow.
 ! no network import-check: the locator /48 is anchored by a blackhole static
 ! (unreachable next-hop), so without this FRR marks the network-originated
 ! prefix "invalid" and never advertises it. This is the standard knob for
 ! originating an aggregate/anchor prefix.
 no bgp network import-check
 neighbor SPINES6 peer-group
 neighbor SPINES6 remote-as 65000
 neighbor SPINES6 advertisement-interval 0
 neighbor SPINES6 timers 3 9
 neighbor fc00:1:3::0 peer-group SPINES6
 neighbor fc00:1:3::0 description spine1-v6
 neighbor fc00:2:3::0 peer-group SPINES6
 neighbor fc00:2:3::0 description spine2-v6
 !
 address-family ipv6 unicast
  network fcbb:bb00:3::/48
  maximum-paths 64
  neighbor SPINES6 activate
  neighbor SPINES6 soft-reconfiguration inbound
 exit-address-family
!
