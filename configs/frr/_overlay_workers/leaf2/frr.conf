! AIDC Lab — leaf2 (AS 65102) — underlay + EVPN-VXLAN with workers ON THE OVERLAY (Lab 3 canonical)
! See leaf1's frr.conf for the rationale (eth3/eth4 are L2 bridge members, not L3).
frr defaults datacenter
hostname leaf2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.1.2/32
 ip address 10.0.10.2/32
!
interface eth1
 description to_spine1
 ip address 10.1.1.3/31
!
interface eth2
 description to_spine2
 ip address 10.1.2.3/31
!
!
router bgp 65102
 bgp router-id 10.0.1.2
 bgp bestpath as-path multipath-relax
 no bgp default ipv4-unicast
 neighbor SPINES peer-group
 neighbor SPINES advertisement-interval 0
 neighbor SPINES timers 3 9
 neighbor 10.1.1.2 remote-as 65000
 neighbor 10.1.1.2 peer-group SPINES
 neighbor 10.1.1.2 description spine1
 neighbor 10.1.2.2 remote-as 65000
 neighbor 10.1.2.2 peer-group SPINES
 neighbor 10.1.2.2 description spine2
 !
 address-family ipv4 unicast
  network 10.0.1.2/32
  network 10.0.10.2/32
  maximum-paths 64
  neighbor SPINES activate
  neighbor SPINES soft-reconfiguration inbound
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
 exit-address-family
!
line vty
!
