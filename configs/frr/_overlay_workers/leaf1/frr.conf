! AIDC Lab — leaf1 (AS 65101) — underlay + EVPN-VXLAN with workers ON THE OVERLAY (Lab 3 canonical)
!
! Differences vs _overlay/leaf1/frr.conf:
!   - eth3 and eth4 no longer have L3 IPs. They are bridge members of
!     VLAN 1000 instead (added by overlay-setup.sh after FRR boots).
!   - The matching `network 10.2.1.0/31` / `10.2.1.2/31` BGP IPv4-unicast
!     advertisements are gone, since the worker /31 underlay is retired.
!
! eth1/eth2 (spine uplinks) and the loopback IPs are unchanged.
frr defaults datacenter
hostname leaf1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.1.1/32
 ip address 10.0.10.1/32
!
interface eth1
 description to_spine1
 ip address 10.1.1.1/31
!
interface eth2
 description to_spine2
 ip address 10.1.2.1/31
!
! eth3 and eth4 deliberately have NO ip address — they're L2 access ports
! into the VLAN 1000 bridge (configured by overlay-setup.sh).
!
router bgp 65101
 bgp router-id 10.0.1.1
 bgp bestpath as-path multipath-relax
 no bgp default ipv4-unicast
 neighbor SPINES peer-group
 neighbor SPINES advertisement-interval 0
 neighbor SPINES timers 3 9
 neighbor 10.1.1.0 remote-as 65000
 neighbor 10.1.1.0 peer-group SPINES
 neighbor 10.1.1.0 description spine1
 neighbor 10.1.2.0 remote-as 65000
 neighbor 10.1.2.0 peer-group SPINES
 neighbor 10.1.2.0 description spine2
 !
 address-family ipv4 unicast
  network 10.0.1.1/32
  network 10.0.10.1/32
  maximum-paths 64
  neighbor SPINES activate
  neighbor SPINES soft-reconfiguration inbound
 exit-address-family
 !
 ! EVPN: advertise the kernel VXLAN dev (vtep-1000) + the local bridge fdb.
 ! advertise-all-vni picks up the VLAN 1000 bridge and originates Type-2
 ! routes for the MACs gpu1/gpu2 land on Bridge once they're up on overlay.
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
 exit-address-family
!
line vty
!
